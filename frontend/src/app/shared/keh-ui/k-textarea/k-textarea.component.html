<app-field-container

    [Question]="Question"

    [control]="control"

>


    <textarea

        matInput

        rows="4"

        [formControl]="control"

        [placeholder]="Question.placeholder || ''"

        [readonly]="Question.readOnly ?? false"

        [attr.minlength]="Question.minLength ?? null"

        [attr.maxlength]="Question.maxLength ?? null"

    ></textarea>


</app-field-container>

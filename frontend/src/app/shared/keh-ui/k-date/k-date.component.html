<div class="date-field">


    <mat-form-field appearance="outline">


        <mat-label>

            {{ Question.title || 'Date' }}

        </mat-label>



        <input

            matInput

            type="date"

            [(ngModel)]="value"

            [readonly]="Question.readOnly"

            [required]="Question.required"

            [min]="Question.minDate || null"

            [max]="Question.maxDate || null"

        >


    </mat-form-field>



    @if(Question.helpText){

        <small class="help">

            {{ Question.helpText }}

        </small>

    }


</div>

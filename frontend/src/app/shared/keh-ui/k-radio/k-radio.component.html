<app-field-container

    [Question]="Question"

    [control]="control"

>


    <mat-radio-group

        [formControl]="control"

        class="radio-group"

    >


        @for(option of Question.options; track option.id){


            <mat-radio-button

                [value]="option.value"

                [disabled]="Question.readOnly"

            >

                {{ option.label }}

            </mat-radio-button>


        }


    </mat-radio-group>


</app-field-container>

<app-field-container

    [Question]="Question"

    [control]="control"

>


    <mat-select

        [formControl]="control"

        [disabled]="Question.readOnly ?? false"

    >


        @for(option of Question.options; track option.id){


            <mat-option

                [value]="option.value"

            >

                {{ option.label }}

            </mat-option>


        }


    </mat-select>


</app-field-container>

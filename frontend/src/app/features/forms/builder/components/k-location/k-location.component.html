<div class="location-field">


    <h4>

        {{Question.title || 'Location'}}

    </h4>



    <div class="coordinates">


        <mat-form-field appearance="outline">


            <mat-label>
                Latitude
            </mat-label>


            <input

                matInput

                type="number"

                [value]="latitude"

                (input)="updateLatitude($any($event.target).value)"

                [readonly]="Question.readOnly"

            >


        </mat-form-field>





        <mat-form-field appearance="outline">


            <mat-label>
                Longitude
            </mat-label>


            <input

                matInput

                type="number"

                [value]="longitude"

                (input)="updateLongitude($any($event.target).value)"

                [readonly]="Question.readOnly"

            >


        </mat-form-field>



    </div>




    <div class="location-preview">


        <span>

            📍

        </span>



        <div>

            Latitude :
            {{latitude}}

            <br>

            Longitude :
            {{longitude}}

        </div>


    </div>



</div>

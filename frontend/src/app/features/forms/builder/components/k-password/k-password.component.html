<mat-form-field
    appearance="outline"
    class="full"
>


    <mat-label>

        {{ Question.title || 'Password' }}

    </mat-label>


    <input

        matInput

        [type]="hidePassword ? 'password' : 'text'"

        [placeholder]="Question.placeholder || ''"

        [required]="Question.required"

        [readonly]="Question.readOnly"

        [attr.minlength]="Question.minLength || null"

        [attr.maxlength]="Question.maxLength || null"

    >




    <button

        mat-icon-button

        matSuffix

        type="button"

        (click)="togglePassword()"

    >


        <mat-icon>

            {{hidePassword ? 'visibility' : 'visibility_off'}}

        </mat-icon>


    </button>


</mat-form-field>



@if(Question.helpText){

<p class="help">

    {{Question.helpText}}

</p>

}

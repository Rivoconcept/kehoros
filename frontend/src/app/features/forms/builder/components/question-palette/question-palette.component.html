<div class="palette">


@for(group of questionGroups; track group.label){


<div class="group">


<div class="group-title">

{{group.label}}

</div>



<div class="items">


@for(item of group.items; track item.type){


<button

class="question-type"

(click)="addQuestion(item.type)"

>


<mat-icon>

{{item.icon}}

</mat-icon>



<span>

{{item.label}}

</span>


</button>


}


</div>


</div>


}


</div>

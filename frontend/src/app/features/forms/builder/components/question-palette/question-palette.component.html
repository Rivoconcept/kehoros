<div class="palette">

    <h3>
        Add
    </h3>

    <button
        class="question-type"
        *ngFor="let item of questionTypes"
        (click)="addQuestion(item.type)"
    >

        <mat-icon>

            {{ item.icon }}

        </mat-icon>

        <span>

            {{ item.label }}

        </span>

    </button>

</div>

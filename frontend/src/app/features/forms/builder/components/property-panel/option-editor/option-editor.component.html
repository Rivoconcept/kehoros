<div class="options-editor">


    <h3>
        Options
    </h3>



    @for(option of options; track option.id; let i = $index){


        <div class="option-row">


            <mat-form-field appearance="outline">


                <mat-label>
                    Option {{ i + 1 }}
                </mat-label>


                <input

                    matInput

                    [value]="option.label"

                    (input)="update(
                        i,
                        $any($event.target).value
                    )"

                />


            </mat-form-field>



            <button

                mat-icon-button

                color="warn"

                type="button"

                (click)="remove(i)"

            >

                <mat-icon>
                    delete
                </mat-icon>


            </button>


        </div>


    }



    <button

        mat-raised-button

        type="button"

        (click)="add()"

    >

        Ajouter une option

    </button>


</div>

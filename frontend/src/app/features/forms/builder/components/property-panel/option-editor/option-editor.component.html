<div class="options-editor">


    <div class="header">

        <h3>
            Options
        </h3>


        <button

            mat-raised-button

            type="button"

            (click)="add()"

        >

            Add

        </button>


    </div>





    @for(option of options; track option.id; let i=$index){


        <div class="option-row">


            <mat-form-field appearance="outline">


                <mat-label>
                    Option {{i + 1}}
                </mat-label>


                <input

                    matInput

                    [value]="option.label"

                    (input)="updateLabel(
                        i,
                        $any($event.target).value
                    )"

                />


            </mat-form-field>





            <button

                mat-icon-button

                color="warn"

                type="button"

                (click)="remove(i)"

            >

                <mat-icon>
                    delete
                </mat-icon>


            </button>


        </div>


    }



    @if(!options.length){


        <div class="empty">

            Aucune option

        </div>


    }


</div>

<div class="text-card">


    <div class="card-header">


        <div class="actions">


            <button

                mat-icon-button

                type="button"

                (click)="duplicateQuestion($event)"

            >

                <mat-icon>
                    content_copy
                </mat-icon>


            </button>





            <button

                mat-icon-button

                color="warn"

                type="button"

                (click)="deleteQuestion($event)"

            >

                <mat-icon>
                    delete
                </mat-icon>


            </button>


        </div>


    </div>





    <div class="text-preview">


        <input

            type="text"

            placeholder="Short answer..."

            disabled

        />


    </div>


</div>

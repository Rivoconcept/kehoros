<div class="w-full flex-1 flex flex-col p-6 overflow-y-auto">
    @if (activeSection() === 'Tableau de bord') {
        <div class="w-full flex flex-col">
            <div class="stats-grid">
                @for (stat of stats(); track stat.label) {
                    <p-card class="stat-card">
                        <div class="stat-card-content">
                            <div class="stat-icon" [style.background]="stat.color + '20'">
                                <i class="pi" [ngClass]="stat.icon" [style.color]="stat.color" aria-hidden="true"></i>
                            </div>
                            <div class="stat-info">
                                <span class="stat-value">{{ stat.value }}</span>
                                <span class="stat-label">{{ stat.label }}</span>
                            </div>
                        </div>
                    </p-card>
                }
            </div>
        </div>
    } @else if (activeSection() === 'Forms / Templates') {
        <div class="w-full flex-1 flex flex-col">
            <app-template-list />
        </div>
    } @else {
        <div class="w-full flex-1 flex flex-col gap-4">
            <div class="rounded-lg bg-surface-100 dark:bg-surface-800 h-48 p-4 flex items-center justify-center text-sm text-muted-color">
                Contenu de la section : <strong class="ml-1">{{ activeSection() }}</strong>
            </div>
            <div class="rounded-lg bg-surface-100 dark:bg-surface-800 flex-1"></div>
        </div>
    }
</div>

<div class="password-container">
  <mat-card class="password-card">
    <div class="card-header">
      <div class="logo">K</div>
      <h1 class="card-title">Mot de passe oublié ?</h1>
      <p class="card-subtitle">Recevez un code pour choisir un nouveau mot de passe.</p>
    </div>

    <mat-card-content>
      @if (error) {
        <div class="error" role="alert">
          <mat-icon>error_outline</mat-icon>
          <span>{{ error }}</span>
        </div>
      }

      <form (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full">
          <mat-label>Adresse e-mail</mat-label>
          <input
            matInput
            type="email"
            [(ngModel)]="email"
            name="email"
            autocomplete="email"
            placeholder="vous@kehoros.mg"
            required
          />
          <mat-icon matSuffix>email</mat-icon>
        </mat-form-field>

        <button mat-raised-button color="primary" class="submit" [disabled]="loading">
          @if (loading) {
            Envoi en cours...
          } @else {
            <ng-container><mat-icon>send</mat-icon>Recevoir un code</ng-container>
          }
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions>
      <a routerLink="/login"><mat-icon>arrow_back</mat-icon> Retour à la connexion</a>
    </mat-card-actions>
  </mat-card>
</div>

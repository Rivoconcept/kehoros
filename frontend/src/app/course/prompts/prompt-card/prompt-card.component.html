    <div class="container">
        <div class="card-head">
            <div>
                {{ prompt().title }} par {{prompt().author.username}}
            </div>
            <div style="gap: 10;">
                <button type="button" class="btn btn-primary">Edit</button>
                <button (click)="copyToClipBoard()">Copy</button>
            </div>
        </div>
        <textarea readonly class="content">{{prompt().content}} </textarea>
        <div>
            <span>{{prompt().category.name}} </span>
            <button>Upvote</button>
            <span>{{prompt().score}} </span>
            <button>Downvote</button>
        </div>
    </div>

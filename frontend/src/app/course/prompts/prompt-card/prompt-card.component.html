

<p-card class="mb-3">
    <div class="flex justify-content-between align-items-center">
        <div>
            <h3 class="mb-0">{{ prompt().title }}</h3>
            <div class="text-sm text-color-secondary">&#64;{{prompt().author.username}} </div>
        </div>
        <div class="flex gap-2 align-items-center">
            <button pButton type="button" size="small" [text]="true" ><p-icon-field class="pi pi-pencil"></p-icon-field></button>
            <button pButton type="button" size="small" [text]="true" (onClick)="copyToClipBoard()"><p-icon-field class="pi pi-copy"></p-icon-field></button>
        </div>
    </div>
    <textarea pTextarea readonly  class="w-full mb-2" rows="8">{{prompt().content}}</textarea>
    <div class="flex justify-content-between align-items-center">
        <p-tag [value]="prompt().category.name"/>

        <div class="flex gap-2 align-items-center " >
            <button pButton type="button" size="small" severity="secondary"><p-icon-field class="pi pi-thumbs-up"></p-icon-field></button>

            <span>{{prompt().score}} </span>
            <button pButton type="button" size="small" severity="secondary"><p-icon-field class="pi pi-thumbs-down"></p-icon-field></button>

        </div>
    </div>

</p-card>
